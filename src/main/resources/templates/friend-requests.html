<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Friend Requests - Network Community</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/posts">

            Network Community

        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="/posts">

                        Feed

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/users">

                        Users

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link active"
                       href="/friends/requests">

                        Friend Requests

                    </a>

                </li>

            </ul>

            <form action="/logout"
                  method="post">

                <button
                        type="submit"
                        class="btn btn-outline-light">

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-lg-8">

            <div class="mb-4">

                <h1 class="fw-bold">
                    Friend Requests
                </h1>

                <p class="text-muted">
                    Manage your pending friend requests.
                </p>

            </div>

            <div
                    class="card shadow-sm"
                    th:if="${#lists.isEmpty(requests)}">

                <div class="card-body text-center py-5">

                    <div class="fs-1 mb-3">
                        🤝
                    </div>

                    <h4>
                        No pending friend requests
                    </h4>

                    <p class="text-muted mb-4">
                        You don't have any pending friend requests.
                    </p>

                    <a
                            href="/users"
                            class="btn btn-primary">

                        Find Users

                    </a>

                </div>

            </div>

            <div
                    th:each="req : ${requests}"
                    class="card shadow-sm mb-3">

                <div class="card-body">

                    <div
                            class="d-flex
                                   flex-column
                                   flex-md-row
                                   justify-content-between
                                   align-items-md-center
                                   gap-3">

                        <div>

                            <h5 class="mb-1">

                                <span
                                        th:text="${req.sender.name}">
                                </span>

                                wants to be your friend.

                            </h5>

                            <p class="text-muted mb-0">
                                Friend request
                            </p>

                        </div>

                        <div class="d-flex gap-2">

                            <form
                                    th:action="@{/friends/accept/{id}(id=${req.id})}"
                                    method="post">

                                <button
                                        type="submit"
                                        class="btn btn-success">

                                    ✓ Accept

                                </button>

                            </form>

                            <form
                                    th:action="@{/friends/reject/{id}(id=${req.id})}"
                                    method="post">

                                <button
                                        type="submit"
                                        class="btn btn-outline-danger">

                                    ✕ Reject

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
