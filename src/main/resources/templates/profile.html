<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Profile - Network Community</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/posts">

            Network Community

        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="/posts">

                        Feed

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/users">

                        Users

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/friends/requests">

                        Friend Requests

                    </a>

                </li>

            </ul>

            <form action="/logout"
                  method="post">

                <button
                        type="submit"
                        class="btn btn-outline-light">

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>


<!-- PROFILE -->

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-lg-8">

            <div class="card shadow-sm mb-4">

                <div class="card-body text-center py-5">

                    <div
                            class="rounded-circle
                                   bg-secondary
                                   text-white
                                   d-flex
                                   align-items-center
                                   justify-content-center
                                   mx-auto
                                   mb-3"
                            style="width: 100px; height: 100px;">

                        <span class="fs-1">
                            👤
                        </span>

                    </div>

                    <h1
                            class="fw-bold"
                            th:text="${user.name}">

                    </h1>

                    <p
                            class="text-muted"
                            th:text="${user.email}">

                    </p>

                </div>

            </div>


            <!-- ABOUT -->

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <h4 class="mb-3">
                        About
                    </h4>

                    <div class="mb-3">

                        <strong>
                            Name
                        </strong>

                        <p
                                class="text-muted mb-0"
                                th:text="${user.name}">

                        </p>

                    </div>

                    <div class="mb-3">

                        <strong>
                            Email
                        </strong>

                        <p
                                class="text-muted mb-0"
                                th:text="${user.email}">

                        </p>

                    </div>

                    <div>

                        <strong>
                            Bio
                        </strong>

                        <p
                                class="text-muted mb-0"
                                th:text="${user.bio != null and !user.bio.isEmpty() ? user.bio : 'No bio available.'}">

                        </p>

                    </div>

                </div>

            </div>


            <!-- FRIEND REQUESTS -->

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4 class="mb-3">
                        Friend Requests
                    </h4>

                    <div
                            th:if="${#lists.isEmpty(requests)}"
                            class="alert alert-info mb-0">

                        No pending friend requests.

                    </div>

                    <div
                            th:each="request : ${requests}"
                            class="border rounded p-3 mb-3">

                        <div
                                class="d-flex
                                       flex-column
                                       flex-md-row
                                       justify-content-between
                                       align-items-md-center
                                       gap-3">

                            <div>

                                <h5 class="mb-1">

                                    <span
                                            th:text="${request.sender.name}">
                                    </span>

                                    wants to be your friend.

                                </h5>

                            </div>

                            <div class="d-flex gap-2">

                                <form
                                        th:action="@{/friends/accept/{id}(id=${request.id})}"
                                        method="post">

                                    <button
                                            type="submit"
                                            class="btn btn-success btn-sm">

                                        ✓ Accept

                                    </button>

                                </form>

                                <form
                                        th:action="@{/friends/reject/{id}(id=${request.id})}"
                                        method="post">

                                    <button
                                            type="submit"
                                            class="btn btn-outline-danger btn-sm">

                                        ✕ Reject

                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <div class="text-center mt-4">

                <a
                        href="/users"
                        class="btn btn-outline-secondary">

                    ← Back to Users

                </a>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
