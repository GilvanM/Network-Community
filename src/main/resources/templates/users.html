<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Users - Network Community</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/posts">

            Network Community

        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="/posts">

                        Feed

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link active"
                       href="/users">

                        Users

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/friends/requests">

                        Friend Requests

                    </a>

                </li>

            </ul>

            <form action="/logout"
                  method="post">

                <button
                        type="submit"
                        class="btn btn-outline-light">

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-lg-9">

            <div class="mb-4">

                <h1 class="mb-1">
                    Users
                </h1>

                <p class="text-muted mb-0">
                    Find people and add new friends.
                </p>

            </div>

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <form
                            action="/users"
                            method="get"
                            class="row g-2">

                        <div class="col-12 col-md-9">

                            <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Search users by name"
                                    th:value="${search}">

                            <input
                                    type="hidden"
                                    name="page"
                                    value="0">

                        </div>

                        <div class="col-12 col-md-3">

                            <button
                                    type="submit"
                                    class="btn btn-primary w-100">

                                🔍 Search

                            </button>

                        </div>

                    </form>

                </div>

            </div>

            <div class="row g-3">

                <div
                        class="col-12 col-md-6"
                        th:each="user : ${users}">

                    <div class="card shadow-sm h-100">

                        <div class="card-body">

                            <div class="d-flex
                                        justify-content-between
                                        align-items-start">

                                <div>

                                    <h5
                                            class="card-title mb-1"
                                            th:text="${user.name}">
                                    </h5>

                                    <p
                                            class="text-muted mb-3"
                                            th:text="${user.email}">
                                    </p>

                                </div>

                                <span class="badge bg-secondary">
                                    User
                                </span>

                            </div>

                            <div class="d-flex gap-2 flex-wrap">

                                <a
                                        th:href="@{/profile/{id}(id=${user.id})}"
                                        class="btn btn-outline-primary btn-sm">

                                    View Profile

                                </a>

                                <form
                                        th:if="${user.email != currentUser}"
                                        th:action="@{/friends/request/{id}(id=${user.id})}"
                                        method="post">

                                    <button
                                            type="submit"
                                            class="btn btn-primary btn-sm">

                                        ➕ Add Friend

                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div
                    class="alert alert-info mt-4"
                    th:if="${#lists.isEmpty(users)}">

                No users found.

            </div>

            <nav
                    th:if="${totalPages > 1}"
                    class="mt-4">

                <ul class="pagination justify-content-center">

                    <li
                            class="page-item"
                            th:classappend="${currentPage == 0} ? 'disabled'">

                        <a
                                class="page-link"
                                th:if="${currentPage > 0}"
                                th:href="@{/users(
                                    page=${currentPage - 1},
                                    name=${search}
                                )}">

                            Previous

                        </a>

                        <span
                                class="page-link"
                                th:if="${currentPage == 0}">

                            Previous

                        </span>

                    </li>

                    <li
                            class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">

                        <a
                                class="page-link"
                                th:href="@{/users(
                                    page=${i},
                                    name=${search}
                                )}"
                                th:text="${i + 1}">

                        </a>

                    </li>

                    <li
                            class="page-item"
                            th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">

                        <a
                                class="page-link"
                                th:if="${currentPage < totalPages - 1}"
                                th:href="@{/users(
                                    page=${currentPage + 1},
                                    name=${search}
                                )}">

                            Next

                        </a>

                        <span
                                class="page-link"
                                th:if="${currentPage >= totalPages - 1}">

                            Next

                        </span>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
