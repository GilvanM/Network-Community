<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Feed - Network Community</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/posts">

            Network Community

        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link active"
                       href="/posts">

                        Feed

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/users">

                        Users

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/friends/requests">

                        Friend Requests

                    </a>

                </li>

            </ul>

            <form action="/logout"
                  method="post">

                <button
                        type="submit"
                        class="btn btn-outline-light">

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-lg-8">

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <h4 class="card-title mb-3">

                        Create a new post

                    </h4>

                    <form
                            action="/posts/create"
                            method="post">

                        <div class="mb-3">

                            <textarea
                                    id="content"
                                    name="content"
                                    class="form-control"
                                    rows="4"
                                    placeholder="What's on your mind?"
                                    required></textarea>

                        </div>

                        <div class="text-end">

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                Post

                            </button>

                        </div>

                    </form>

                </div>

            </div>

            <h3 class="mb-3">
                Feed
            </h3>

            <div
                    class="card shadow-sm mb-3"
                    th:each="post : ${posts}">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <div>

                            <h5
                                    class="mb-0"
                                    th:text="${post.user.name}">

                            </h5>

                        </div>

                        <small
                                class="text-muted"
                                th:text="${#temporals.format(post.createdAt,'dd/MM/yyyy HH:mm')}">

                        </small>

                    </div>

                    <p
                            class="card-text"
                            th:text="${post.content}">

                    </p>

                    <div class="border-top pt-3">

                        <form
                                th:action="@{/posts/{id}/like(id=${post.id})}"
                                method="post">

                            <button
                                    type="submit"
                                    class="btn btn-outline-danger btn-sm">

                                ❤️ Like

                                <span
                                        th:text="${post.likes}">

                                </span>

                            </button>

                        </form>

                    </div>

                </div>

            </div>

            <div
                    class="alert alert-info"
                    th:if="${#lists.isEmpty(posts)}">

                There are no posts in your feed yet.

            </div>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
