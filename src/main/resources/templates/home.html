<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Home - Network Community</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/posts">

            Network Community

        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link active"
                       href="/">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/posts">

                        Feed

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/users">

                        Users

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="/friends/requests">

                        Friend Requests

                    </a>

                </li>

            </ul>

            <form action="/logout"
                  method="post">

                <button
                        type="submit"
                        class="btn btn-outline-light">

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>


<!-- CONTENT -->

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-lg-9">

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <h1 class="fw-bold">
                        Welcome to Network Community
                    </h1>

                    <p class="text-muted">

                        You are logged in as

                        <strong th:text="${currentUser}">
                        </strong>

                    </p>

                    <a
                            href="/posts"
                            class="btn btn-primary">

                        Go to Feed

                    </a>

                    <a
                            href="/users"
                            class="btn btn-outline-primary">

                        Find Users

                    </a>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <h4 class="mb-3">
                        Find Users
                    </h4>

                    <form
                            action="/users"
                            method="get"
                            class="row g-2">

                        <div class="col-12 col-md-9">

                            <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Search users by name"
                                    th:value="${search}">

                            <input
                                    type="hidden"
                                    name="page"
                                    value="0">

                        </div>

                        <div class="col-12 col-md-3">

                            <button
                                    type="submit"
                                    class="btn btn-primary w-100">

                                🔍 Search

                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- USERS -->

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4 class="mb-3">
                        Registered Users
                    </h4>

                    <div
                            class="list-group">

                        <div
                                class="list-group-item"
                                th:each="user : ${users}">

                            <div
                                    class="d-flex
                                           flex-column
                                           flex-md-row
                                           justify-content-between
                                           align-items-md-center
                                           gap-2">

                                <div>

                                    <h5
                                            class="mb-1"
                                            th:text="${user.name}">

                                    </h5>

                                    <p
                                            class="text-muted mb-0"
                                            th:text="${user.email}">

                                    </p>

                                </div>

                                <a
                                        th:href="@{/profile/{id}(id=${user.id})}"
                                        class="btn btn-outline-primary btn-sm">

                                    View Profile

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- PAGINATION -->

            <nav
                    th:if="${totalPages > 1}"
                    class="mt-4">

                <ul class="pagination justify-content-center">

                    <li
                            class="page-item"
                            th:classappend="${currentPage == 0} ? 'disabled'">

                        <a
                                class="page-link"
                                th:if="${currentPage > 0}"
                                th:href="@{/users(
                                    page=${currentPage - 1},
                                    name=${search}
                                )}">

                            Previous

                        </a>

                        <span
                                class="page-link"
                                th:if="${currentPage == 0}">

                            Previous

                        </span>

                    </li>

                    <li
                            class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">

                        <a
                                class="page-link"
                                th:href="@{/users(
                                    page=${i},
                                    name=${search}
                                )}"
                                th:text="${i + 1}">

                        </a>

                    </li>

                    <li
                            class="page-item"
                            th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">

                        <a
                                class="page-link"
                                th:if="${currentPage < totalPages - 1}"
                                th:href="@{/users(
                                    page=${currentPage + 1},
                                    name=${search}
                                )}">

                            Next

                        </a>

                        <span
                                class="page-link"
                                th:if="${currentPage >= totalPages - 1}">

                            Next

                        </span>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
